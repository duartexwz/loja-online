server {
    listen 8070;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML nunca em cache: garante que o navegador sempre busque as
    # referências ?v= mais recentes dos assets (evita JS velho travando o Brick)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Assets versionados (?v=): cache longo, invalidados pela query string
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
    }

    # ^~ = prefixo tem prioridade sobre os regex de cache acima (sem isso,
    #  arquivos .png/.jpg em /uploads caíam no cache estático e davam 404)
    location ^~ /api/ {
        proxy_pass http://backend:8055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8055/uploads/;
        proxy_set_header Host $host;
    }
}
