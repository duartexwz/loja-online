<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP Croco - Entrar</title>
  <link rel="stylesheet" href="/styles/base.css?v=23">
  <link rel="stylesheet" href="/styles/login.css?v=21">
</head>
<body>
  <div id="app" class="auth-page">
    <div class="auth-hero">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <svg class="auth-logo-icon" width="40" height="28" viewBox="0 0 40 28" fill="none">
              <path d="M20 0C12 0 6 5 3 10c-2 3-3 7-1 11 1 2 3 4 5 5l1-2c-1-2-2-3-3-5C4 14 5 10 8 7c3-3 8-6 12-6s9 3 12 6c3 3 4 7 3 11-1 2-2 4-3 5l1 2c2-1 4-3 5-5 2-4 1-8-1-11C34 5 28 0 20 0z" fill="currentColor"/>
              <path d="M20 8c-3 0-6 2-7 5l2 1c1-2 3-3 5-3s4 1 5 3l2-1c-1-3-4-5-7-5z" fill="currentColor"/>
              <path d="M14 18c0 3 3 6 6 6s6-3 6-6-3-6-6-6-6 3-6 6z" fill="currentColor"/>
            </svg>
            <span class="auth-logo-text">JP CROCO</span>
          </div>

          <!-- LOGIN FORM -->
          <div id="loginView">
            <h1 class="auth-title">Bem-vindo de volta</h1>
            <p class="auth-subtitle">Entre com sua conta para continuar</p>
          </div>

          <!-- REGISTER FORM -->
          <div id="registerView" style="display:none">
            <h1 class="auth-title">Criar Conta</h1>
            <p class="auth-subtitle">Preencha seus dados para se cadastrar</p>
          </div>
        </div>

        <div class="auth-body">
          <div class="auth-error" id="authError"></div>

          <!-- LOGIN -->
          <form id="loginForm" onsubmit="Login.login(event)">
            <div class="form-group">
              <label class="form-label" for="loginUsername">Email</label>
              <input type="email" id="loginUsername" name="username" required placeholder="seu@email.com" autocomplete="username" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Informe um email válido">
            </div>
            <div class="form-group password-field">
              <label class="form-label" for="loginPassword">Senha</label>
              <input type="password" id="loginPassword" name="password" required placeholder="Sua senha" autocomplete="current-password">
              <button type="button" class="password-toggle" onclick="Login.toggleSenha('loginPassword', this)" aria-label="Mostrar senha">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <div class="form-row" style="justify-content:flex-end;margin-bottom:4px">
              <a href="#" class="forgot-link" onclick="Login.mostrarEsqueciSenha(event)">Esqueci minha senha</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
              Entrar
            </button>
          </form>

          <!-- REGISTER -->
          <form id="registerForm" style="display:none" onsubmit="Login.registrar(event)">
            <div class="form-group">
              <label class="form-label" for="regUsername">Email</label>
              <input type="email" id="regUsername" name="username" required placeholder="seu@email.com" autocomplete="username" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Informe um email válido">
            </div>
            <div class="form-group">
              <label class="form-label" for="regNomeCompleto">Nome Completo</label>
              <input type="text" id="regNomeCompleto" name="nome_completo" required placeholder="Seu nome completo" autocomplete="name">
            </div>
            <div class="form-group">
              <label class="form-label" for="regPassword">Senha</label>
              <input type="password" id="regPassword" name="password" required placeholder="Escolha uma senha" minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
              <label class="form-label" for="regConfirmPassword">Confirmar Senha</label>
              <input type="password" id="regConfirmPassword" name="confirmPassword" required placeholder="Confirme sua senha" minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
              Criar Conta
            </button>
          </form>

          <!-- FORGOT PASSWORD -->
          <form id="forgotForm" style="display:none" onsubmit="Login.esqueciSenha(event)">
            <div id="forgotView">
              <div class="form-group">
                <label class="form-label" for="forgotEmail">Email cadastrado</label>
                <input type="email" id="forgotEmail" name="email" required placeholder="seu@email.com">
              </div>
              <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgotBtn">
                Enviar Link de Redefinicao
              </button>
              <button type="button" class="btn btn-ghost btn-block" onclick="Login.voltarLogin()">
                Voltar ao Login
              </button>
            </div>
            <div id="forgotSuccess" style="display:none">
              <div class="auth-success">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--verde-lacoste)" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                  <path d="M22 4L12 14.01l-3-3"/>
                </svg>
                <h3>Email enviado!</h3>
                <p>Verifique sua caixa de entrada e clique no link para redefinir sua senha.</p>
                <button type="button" class="btn btn-primary btn-block" onclick="Login.voltarLogin()">
                  Voltar ao Login
                </button>
              </div>
            </div>
          </form>
        </div>

        <div class="auth-toggle" id="authToggle">
          <span id="toggleText">Nao tem conta?</span>
          <a href="#" id="toggleLink" onclick="Login.toggleView(event)">Cadastre-se</a>
        </div>

        <div class="auth-footer-link">
          <a href="/pages/home.html">&larr; Voltar para a loja</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/script/config.js?v=21"></script>
  <script src="/script/api.js?v=21"></script>
  <script src="/script/cart.js?v=21"></script>
  <script src="/script/components.js?v=25"></script>
  <script>
    const Login = {
      isRegister: false,
      isForgot: false,

      toggleView(e) {
        e.preventDefault();
        this.isRegister = !this.isRegister;
        this.isForgot = false;
        this.limparErro();

        const loginView = document.getElementById('loginView');
        const registerView = document.getElementById('registerView');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const forgotForm = document.getElementById('forgotForm');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');

        loginForm.style.display = this.isRegister ? 'none' : 'block';
        registerForm.style.display = this.isRegister ? 'block' : 'none';
        forgotForm.style.display = 'none';
        loginView.style.display = this.isRegister ? 'none' : 'block';
        registerView.style.display = this.isRegister ? 'block' : 'none';
        toggleText.textContent = this.isRegister ? 'Ja tem conta?' : 'Nao tem conta?';
        toggleLink.textContent = this.isRegister ? 'Entrar' : 'Cadastre-se';
      },

      mostrarEsqueciSenha(e) {
        e.preventDefault();
        this.isForgot = true;
        this.limparErro();

        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'block';
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('registerView').style.display = 'none';
        document.getElementById('forgotView').style.display = 'block';
        document.getElementById('forgotSuccess').style.display = 'none';
        document.getElementById('toggleText').textContent = '';
        document.getElementById('toggleLink').textContent = '';
      },

      voltarLogin() {
        this.isForgot = false;
        this.isRegister = false;
        this.limparErro();

        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('registerView').style.display = 'none';
        document.getElementById('toggleText').textContent = 'Nao tem conta?';
        document.getElementById('toggleLink').textContent = 'Cadastre-se';
      },

      async esqueciSenha(e) {
        e.preventDefault();
        this.limparErro();
        const btn = document.getElementById('forgotBtn');
        const email = document.getElementById('forgotEmail').value.trim();

        if (!email) {
          this.mostrarErro('Informe seu email.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Enviando...';

        try {
          await api.esqueciSenha(email);
          document.getElementById('forgotView').style.display = 'none';
          document.getElementById('forgotSuccess').style.display = 'block';
        } catch (err) {
          this.mostrarErro(err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Enviar Link de Redefinicao';
        }
      },

      async login(e) {
        e.preventDefault();
        this.limparErro();
        const btn = document.getElementById('loginBtn');
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) {
          this.mostrarErro('Preencha todos os campos.');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username)) {
          this.mostrarErro('Informe um email válido.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Entrando...';

        try {
          await api.login(username, password);
          window.location.href = '/pages/home.html';
        } catch (err) {
          this.mostrarErro(err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      },

      async registrar(e) {
        e.preventDefault();
        this.limparErro();
        const btn = document.getElementById('registerBtn');
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        const nomeCompleto = document.getElementById('regNomeCompleto').value.trim();
        if (!username || !password || !nomeCompleto) {
          this.mostrarErro('Preencha todos os campos.');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(username)) {
          this.mostrarErro('Informe um email válido.');
          return;
        }

        if (password !== confirmPassword) {
          this.mostrarErro('As senhas nao conferem.');
          return;
        }

        if (password.length < 6) {
          this.mostrarErro('A senha deve ter no minimo 6 caracteres.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Criando conta...';

        try {
          await api.createUsuario({
            username,
            password,
            acesso: 'usuario',
            nome_completo: document.getElementById('regNomeCompleto').value.trim(),
          });
          await api.login(username, password);
          window.location.href = '/pages/home.html';
        } catch (err) {
          this.mostrarErro(err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Criar Conta';
        }
      },

      mostrarErro(msg) {
        const el = document.getElementById('authError');
        el.textContent = msg;
        el.classList.add('ativo');
      },

      limparErro() {
        const el = document.getElementById('authError');
        el.classList.remove('ativo');
      },

      toggleSenha(inputId, btn) {
        const input = document.getElementById(inputId);
        const eyeOpen = btn.querySelector('.eye-open');
        const eyeClosed = btn.querySelector('.eye-closed');
        if (input.type === 'password') {
          input.type = 'text';
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
        } else {
          input.type = 'password';
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
        }
      },

      init() {
        if (api.isLoggedIn()) {
          window.location.href = '/pages/home.html';
        }
      },
    };

    Login.init();
  </script>
</body>
</html>
