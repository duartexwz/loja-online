<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP Croco - A Loja</title>
  <link rel="stylesheet" href="/styles/base.css?v=23">
  <link rel="stylesheet" href="/styles/loja.css?v=21">
</head>
<body>
  <div id="header"></div>

  <main>
    <section class="loja-hero">
      <div class="container">
        <p class="loja-eyebrow">Colecao Completa</p>
        <h1 class="loja-title">A Loja</h1>
        <p class="loja-desc">Explore todos os nossos produtos e encontre pecas que definem o seu estilo.</p>
      </div>
    </section>

    <section class="container">
      <div class="filtros-section">
        <div class="filtros-row">
          <div class="filtros-botoes" id="filtros">
            <button class="filtro-btn ativo" data-filtro="todos" onclick="Loja.filtrar('todos', this)">Todos</button>
          </div>
          <div class="filtros-busca">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" id="buscaInput" placeholder="Buscar produto..." oninput="Loja.buscar(this.value)">
          </div>
        </div>
      </div>

      <p class="contagem" id="contagem">Carregando produtos...</p>

      <div class="produtos-grid" id="produtosGrid">
        <div class="loading-spinner"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>
  <div id="panels"></div>
  <div id="modal"></div>
  <div id="detailModal"></div>

  <script src="/script/config.js?v=21"></script>
  <script src="/script/api.js?v=21"></script>
  <script src="/script/cart.js?v=21"></script>
  <script src="/script/components.js?v=25"></script>
  <script>
    const Loja = {
      produtos: [],
      filtroAtual: 'todos',
      buscaAtual: '',

      async init() {
        document.getElementById('header').innerHTML = Componentes.renderizarHeader('loja');
        document.getElementById('footer').innerHTML = Componentes.renderizarFooter();
        document.getElementById('panels').innerHTML =
          Componentes.renderizarPainelSacola() +
          Componentes.renderizarCheckout();
        document.getElementById('modal').innerHTML = Componentes.renderizarModalSucesso();
        document.getElementById('detailModal').innerHTML = Componentes.renderizarModalDetalhe();
        Componentes.init();
        await this.carregarProdutos();
      },

      async carregarProdutos() {
        const grid = document.getElementById('produtosGrid');
        try {
          const data = await api.getProdutos({ limit: 50 });
          this.produtos = data.produtos || [];
          this.renderizarFiltros();
          this.renderizar();
        } catch (err) {
          grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:60px 24px">
              <p style="color:var(--cinza-500);margin-bottom:16px">Nao foi possivel carregar os produtos.</p>
              <button class="btn btn-outline btn-sm" onclick="Loja.carregarProdutos()">Tentar Novamente</button>
            </div>
          `;
        }
      },

      renderizarFiltros() {
        const tamanhos = [...new Set(this.produtos.flatMap(p => (p.tamanhos && p.tamanhos.length) ? p.tamanhos.map(t => t.tamanho) : [p.tamanho]))].filter(Boolean);
        const container = document.getElementById('filtros');
        container.innerHTML = `<button class="filtro-btn ativo" data-filtro="todos" onclick="Loja.filtrar('todos', this)">Todos</button>`;
        tamanhos.forEach(t => {
          container.innerHTML += `<button class="filtro-btn" data-filtro="${t}" onclick="Loja.filtrar('${t}', this)">${t}</button>`;
        });
      },

      filtrar(filtro, btn) {
        this.filtroAtual = filtro;
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo');
        this.renderizar();
      },

      buscar(valor) {
        this.buscaAtual = valor.toLowerCase().trim();
        this.renderizar();
      },

      _produtoTemTamanho(p, tam) {
        if (!tam || tam === 'todos') return true;
        if (p.tamanhos && p.tamanhos.length) return p.tamanhos.some(t => t.tamanho === tam);
        return p.tamanho === tam;
      },

      getProdutosFiltrados() {
        return this.produtos.filter(p => {
          const matchFiltro = this._produtoTemTamanho(p, this.filtroAtual);
          const matchBusca = !this.buscaAtual || p.nome.toLowerCase().includes(this.buscaAtual);
          return matchFiltro && matchBusca;
        });
      },

      renderizar() {
        const grid = document.getElementById('produtosGrid');
        const contagem = document.getElementById('contagem');
        const filtrados = this.getProdutosFiltrados();

        contagem.innerHTML = `<strong>${filtrados.length}</strong> produto${filtrados.length !== 1 ? 's' : ''} encontrado${filtrados.length !== 1 ? 's' : ''}`;

        if (filtrados.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
              <div class="empty-state-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--cinza-300)" stroke-width="1.5">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="M21 21l-4.35-4.35"/>
                </svg>
              </div>
              <h3 class="empty-state-title">Nenhum produto encontrado</h3>
              <p class="empty-state-text">Tente buscar por outro termo ou ajustar os filtros.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = filtrados.map(p => {
          const semEstoque = p.stock <= 0;
          const tamanhosPreview = (p.tamanhos && p.tamanhos.length)
            ? p.tamanhos.map(t => t.tamanho).join(' / ')
            : (p.tamanho || null);
          const temPromo = p.preco_promocional != null && p.preco_promocional < p.preco;
          return `
          <article class="produto-item" onclick="Loja.abrirDetalhe(${p.id})">
            <div class="produto-img-wrap">
              ${p.imagem ? `<img src="${p.imagem}" alt="${p.nome}" style="width:100%;height:100%;object-fit:cover">` : `<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>`}
              ${semEstoque ? '<span class="produto-tag sem-estoque">Esgotado</span>' : (temPromo ? '<span class="produto-tag promo">Promo</span>' : '')}
            </div>
            <div class="produto-body">
              <h3 class="produto-name">${p.nome}</h3>
              <p class="produto-size">${tamanhosPreview ? `Tamanhos: ${tamanhosPreview}` : ''}</p>
              <div class="produto-row">
                <span class="produto-price">
                  ${temPromo
                    ? `<span class="preco-promo">${api.formatarMoeda(p.preco_promocional)}</span> <span class="preco-riscado">${api.formatarMoeda(p.preco)}</span>`
                    : api.formatarMoeda(p.preco)}
                </span>
                <span class="produto-stock">${p.stock > 0 ? `${p.stock} em estoque` : 'Sem estoque'}</span>
              </div>
            </div>
          </article>
        `}).join('');

        Componentes.atualizarBotoesProduto();
      },

      abrirDetalhe(id) {
        Componentes.abrirDetalhe(id, this.produtos);
      },
    };

    Loja.init();
  </script>
</body>
</html>
