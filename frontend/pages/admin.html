<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP Croco - Painel Administrativo</title>
  <link rel="stylesheet" href="/styles/base.css?v=23">
  <link rel="stylesheet" href="/styles/admin.css?v=21">
</head>
<body>
  <div id="header"></div>

  <div class="admin-layout" id="adminLayout" style="display:none">
    <nav class="admin-nav">
      <button class="admin-nav-item ativo" data-tab="dashboard" onclick="Admin.switchTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button class="admin-nav-item" data-tab="produtos" onclick="Admin.switchTab('produtos')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        Produtos
      </button>
      <button class="admin-nav-item" data-tab="pedidos" onclick="Admin.switchTab('pedidos')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Pedidos
      </button>
      <button class="admin-nav-item" data-tab="usuarios" onclick="Admin.switchTab('usuarios')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Usuarios
      </button>
      <button class="admin-nav-item" data-tab="clientes" onclick="Admin.switchTab('clientes')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Clientes
      </button>
      <button class="admin-nav-item" data-tab="admins" onclick="Admin.switchTab('admins')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        Admins
      </button>
    </nav>

    <main class="admin-content" id="adminContent"></main>
  </div>

  <div class="admin-modal-overlay" id="adminModal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h3 id="adminModalTitle"></h3>
        <button class="admin-modal-close" onclick="Admin.closeModal()">&times;</button>
      </div>
      <div class="admin-modal-body" id="adminModalBody"></div>
      <div class="admin-modal-footer" id="adminModalFooter"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="/script/config.js?v=21"></script>
  <script src="/script/api.js?v=21"></script>
  <script src="/script/cart.js?v=21"></script>
  <script src="/script/components.js?v=24"></script>
  <script>
    const Admin = {
      _currentTab: 'dashboard',
      _data: {},

      async init() {
        const user = api.getUser();
        if (!user || user.acesso !== 'admin') {
          window.location.href = '/pages/home.html';
          return;
        }

        document.getElementById('header').innerHTML = Componentes.renderizarHeader('admin');
        document.getElementById('footer').innerHTML = Componentes.renderizarFooter();
        document.getElementById('adminLayout').style.display = 'grid';

        await this.loadDashboard();
        this._lastPaidId = parseInt(localStorage.getItem('admin_last_pedido_id')||'0',10);
        if(!this._lastPaidId){
          try{ const d=await api.getPedidos({limit:1000}); const max=Math.max(0,...(d.pedidos||[]).map(p=>p.id)); this._lastPaidId=max; localStorage.setItem('admin_last_pedido_id', String(max)); }catch(_){}
        }
        // Semeia o snapshot de status sem notificar (evita spam de "novas compras" no 1º load)
        try {
          const d0 = await api.getPedidos({ limit: 1000 });
          const snap0 = {};
          (d0.pedidos || []).forEach(p => { snap0[p.id] = (p.status || '').toLowerCase(); });
          this._snapshotPedidos = snap0;
          localStorage.setItem('admin_pedidos_snapshot', JSON.stringify(snap0));
        } catch (_) {
          try { this._snapshotPedidos = JSON.parse(localStorage.getItem('admin_pedidos_snapshot') || '{}'); }
          catch (_) { this._snapshotPedidos = {}; }
        }
        this._criarSino();
        this._criarPainelAuto();
        this._registrarSW();
        this._pollInterval = setInterval(() => this.checarNovosPedidos(), 10000);
        // Auto-reload da aba atual a cada 60s (com contagem regressiva visível)
        this._tickInterval = setInterval(() => this._tickReload(), 1000);
        // também checa ao focar a aba
        window.addEventListener('focus', ()=> this.checarNovosPedidos());
      },
      _criarSino(){
        const header=document.querySelector('header .header-inner');
        if(!header || document.getElementById('adminSino')) return;
        const sino=document.createElement('button');
        sino.id='adminSino';
        sino.style.cssText='position:relative;margin-left:12px;background:#111;color:#fff;border:none;padding:8px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px';
        sino.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-6 9-6 9h18s-6-2-6-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg> <span id="adminSinoBadge" style="display:none;background:#e63946;color:#fff;padding:2px 6px;border-radius:999px;font-size:.7rem">0</span>';
        sino.onclick=()=>{ document.getElementById('adminSinoBadge').style.display='none'; this.switchTab('pedidos'); };
        header.querySelector('.nav-topo')?.appendChild(sino);
      },
      _atualizarSino(novos, somar){
        const b=document.getElementById('adminSinoBadge');
        if(b){
          const atual = somar ? (parseInt(b.textContent||'0',10)||0) : 0;
          b.textContent = atual + novos;
          b.style.display='inline-block';
        }
        // som simples
        try{ const a=new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=='); a.volume=0.3; a.play().catch(()=>{});}catch(_){}
      },
      // Registra o Service Worker (push de verdade no aparelho; exige HTTPS/ngrok ou localhost)
      async _registrarSW(){
        this._swReg = null;
        try{
          if(!('serviceWorker' in navigator)) return;
          this._swReg = await navigator.serviceWorker.register('/sw.js');
        }catch(_){
          // HTTP puro de LAN não é contexto seguro: SW não registra; segue toast+som+vibração
          this._swReg = null;
        }
        this._renderNotifBtn();
        // Se já tem permissão, garante a inscrição push (para receber com o site fechado)
        try{
          if(this._swReg && window.Notification && Notification.permission==='granted' && this._notifAtiva !== false){
            await this._inscreverPush();
          }
        }catch(_){}
      },
      _urlBase64ToUint8(b64){
        const p = '='.repeat((4 - b64.length % 4) % 4);
        const s = (b64 + p).replace(/-/g, '+').replace(/_/g, '/');
        const r = atob(s);
        const o = new Uint8Array(r.length);
        for(let i = 0; i < r.length; i++) o[i] = r.charCodeAt(i);
        return o;
      },
      // Inscreve este aparelho no Web Push do backend (chega mesmo com o site fechado)
      async _inscreverPush(){
        try{
          if(!this._swReg || !('PushManager' in window)) return false;
          const vap = await api.request('/push/vapid-key').catch(()=>null);
          const key = vap && vap.public_key;
          if(!key) return false;
          let sub = await this._swReg.pushManager.getSubscription();
          if(!sub) sub = await this._swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: this._urlBase64ToUint8(key) });
          await api.request('/push/subscribe', { method: 'POST', body: JSON.stringify(sub.toJSON()) });
          return true;
        }catch(e){ console.warn('push subscribe falhou', e); return false; }
      },
      async _desinscreverPush(){
        try{
          const s = await this._swReg?.pushManager.getSubscription();
          const ep = s && s.endpoint;
          if(s) await s.unsubscribe();
          if(ep) await api.request('/push/unsubscribe', { method: 'POST', body: JSON.stringify({ endpoint: ep }) }).catch(()=>{});
        }catch(_){}
      },
      // Central de notificação: PAINEL (toast) + APARELHO (push via SW, som, vibração, título)
      async _notificarCompra(titulo, corpo){
        // 1) Sempre no painel do admin
        try{ Componentes.toast(`${titulo} — ${corpo}`, 'success'); }catch(_){}
        if(this._notifAtiva === false) return;
        // 2) No aparelho: push do sistema via Service Worker (funciona com tela bloqueada)
        let pushOk = false;
        try{
          if(this._swReg && window.Notification && Notification.permission==='granted'){
            await this._swReg.showNotification(titulo, {
              body: corpo, tag: 'jpcroco-pedido', renotify: true, vibrate: [200,100,200],
            });
            pushOk = true;
          }
        }catch(_){}
        // Fallback: Notification direta (desktop / sem SW)
        if(!pushOk){
          try{
            if(window.Notification && Notification.permission==='granted'){ new Notification(titulo, {body: corpo}); pushOk = true; }
            else if(window.Notification && Notification.permission!=='denied'){ Notification.requestPermission().catch(()=>{}); }
          }catch(_){}
        }
        // 3) Som + vibração no aparelho
        try{ const a=new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA=='); a.volume=0.4; a.play().catch(()=>{}); }catch(_){}
        try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(_){}
        // 4) Pisca o título da aba (visível mesmo sem permissão de push)
        try{
          if(!this._titleFlash){ this._titleOrig = document.title; this._titleFlashN = 0; }
          clearInterval(this._titleFlash);
          this._titleFlashN = (this._titleFlashN||0) + 1;
          let on = false;
          this._titleFlash = setInterval(()=>{
            on = !on;
            document.title = on ? `(${this._titleFlashN}) ${titulo}` : this._titleOrig;
            if(!on && document.hasFocus()){ clearInterval(this._titleFlash); this._titleFlashN = 0; document.title = this._titleOrig; }
          }, 1000);
        }catch(_){}
        // 5) Avisa se o push do aparelho está indisponível (ex.: HTTP de LAN sem HTTPS)
        if(!pushOk) this._avisarPushIndisponivel();
      },
      _avisarPushIndisponivel(){
        if(this._pushAvisoDado) return;
        const seguro = window.isSecureContext;
        const perm = (window.Notification && Notification.permission) || 'indisponível';
        if(!seguro || perm==='denied' || !('serviceWorker' in navigator)){
          this._pushAvisoDado = true;
          Componentes.toast('Push no aparelho indisponível aqui (use o link HTTPS/ngrok e permita notificações no navegador). No painel você continua sendo avisado.', 'info');
        }
      },
      _renderNotifBtn(){
        const btn = document.getElementById('adminNotifToggle');
        if(!btn) return;
        const perm = (window.Notification && Notification.permission) || '?';
        if(!this._notifAtiva) btn.textContent = '🔕 OFF';
        else if(perm === 'granted') btn.textContent = '🔔 ON';
        else if(perm === 'denied') btn.textContent = '🔕 Bloq.';
        else btn.textContent = '🔔 Ativar';
      },
      // Painel flutuante: contagem do auto-reload + toggles de reload e notificação
      _autoReloadSegundos: 60,
      _reloadRestante: 60,
      _autoReloadAtivo: true,
      _notifAtiva: true,
      _criarPainelAuto(){
        if(document.getElementById('adminAutoBar')) return;
        const bar=document.createElement('div');
        bar.id='adminAutoBar';
        bar.style.cssText='position:fixed;bottom:14px;right:14px;z-index:9500;display:flex;gap:8px;align-items:center;background:#111;color:#fff;padding:8px 12px;border-radius:999px;font-size:.75rem;box-shadow:0 8px 24px rgba(0,0,0,.25)';
        bar.innerHTML=`<span id="adminReloadInfo">↻ em 60s</span>
          <button id="adminReloadToggle" style="background:#fff;color:#111;border:none;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:700;cursor:pointer">Pausar</button>
          <button id="adminNotifToggle" style="background:#25D366;color:#fff;border:none;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:700;cursor:pointer">🔔 ON</button>`;
        document.body.appendChild(bar);
        document.getElementById('adminReloadToggle').onclick=()=>this._toggleAutoReload();
        document.getElementById('adminNotifToggle').onclick=()=>this._toggleNotificacoes();
        this._renderNotifBtn();
      },
      _toggleAutoReload(){
        this._autoReloadAtivo=!this._autoReloadAtivo;
        this._reloadRestante=this._autoReloadSegundos;
        document.getElementById('adminReloadToggle').textContent=this._autoReloadAtivo?'Pausar':'Retomar';
        this._renderReloadInfo();
        Componentes.toast(this._autoReloadAtivo?'Auto-reload ativado (60s).':'Auto-reload pausado.', 'info');
      },
      async _toggleNotificacoes(){
        // Liga: pede permissão do sistema, inscreve o aparelho no push e mostra estado real
        if(this._notifAtiva === false || (window.Notification && Notification.permission !== 'granted')){
          if(window.Notification){
            try{ await Notification.requestPermission(); }catch(_){}
            if(Notification.permission === 'denied'){
              Componentes.toast('Notificações bloqueadas no navegador. Ative nas configurações do site e tente de novo.', 'error');
              this._renderNotifBtn();
              return;
            }
          }
          this._notifAtiva = true;
          const pushOk = await this._inscreverPush();
          this._renderNotifBtn();
          this._notificarCompra('Notificações ativadas', pushOk ? 'Este aparelho recebe push mesmo com o site fechado.' : 'Você será avisado no painel; push com site fechado indisponível aqui (use HTTPS).');
          return;
        }
        this._notifAtiva = false;
        await this._desinscreverPush();
        this._renderNotifBtn();
        Componentes.toast('Notificações do aparelho pausadas (painel continua avisando).', 'info');
      },
      _renderReloadInfo(){
        const el=document.getElementById('adminReloadInfo');
        if(el) el.textContent=this._autoReloadAtivo?`↻ em ${this._reloadRestante}s`:'↻ pausado';
      },
      _tickReload(){
        if(!this._autoReloadAtivo) return;
        this._reloadRestante-=1;
        if(this._reloadRestante<=0){ this._reloadRestante=this._autoReloadSegundos; this._autoReload(); }
        this._renderReloadInfo();
      },
      async _autoReload(){
        // Não recarrega no meio de edição: modal aberta ou digitando em campo
        if(document.getElementById('adminModal')?.classList.contains('ativo')) return;
        const foco=document.activeElement;
        if(foco && ['INPUT','TEXTAREA','SELECT'].includes(foco.tagName)) return;
        try{ await this['load'+this._currentTab.charAt(0).toUpperCase()+this._currentTab.slice(1)](); }catch(_){}
      },
      async checarNovosPedidos() {
        try {
          const data = await api.getPedidos({ limit: 1000 });
          const pedidos=(data.pedidos||[]).slice().sort((a,b)=>b.id-a.id);
          const maxId=pedidos.length?Math.max(...pedidos.map(p=>p.id)):0;
          const snap=this._snapshotPedidos||{};
          let mudou=false;
          const nomesStatus={pago:'Pagamento aprovado ✅',enviado:'Pedido enviado 📦',entregue:'Pedido entregue ✔',recusado:'Pedido recusado ✕',cancelado:'Pedido cancelado ✕',pendente:'Aguardando pagamento ⏳'};
          for(const p of pedidos){
            const st=(p.status||'').toLowerCase();
            const idp=p.id_pedido||('#'+p.id);
            if(!(p.id in snap)){
              // Novo pedido criado (qualquer status = evento de compra)
              this._atualizarSino(1, true);
              this._notificarCompra('🛒 Nova compra!', `Pedido ${idp} • ${p.status} • ${api.formatarMoeda(p.valor_total)}`);
              mudou=true;
            }else if(snap[p.id]!==st){
              // Mudança de status (pagamento aprovado, envio, entrega, recusa...)
              this._atualizarSino(1, true);
              this._notificarCompra('🔔 Atualização de pedido', `Pedido ${idp}: ${nomesStatus[st]||p.status}`);
              mudou=true;
            }
            snap[p.id]=st;
          }
          this._snapshotPedidos=snap;
          try{ localStorage.setItem('admin_pedidos_snapshot', JSON.stringify(snap)); }catch(_){}
          if(maxId > this._lastPaidId){
            this._lastPaidId=maxId;
            localStorage.setItem('admin_last_pedido_id', String(maxId));
          }
          if(mudou){
            if (this._currentTab === 'pedidos') await this.loadPedidos();
            else if (this._currentTab === 'dashboard') await this.loadDashboard();
          }
        } catch(_) {}
      },

      switchTab(tab) {
        this._currentTab = tab;
        document.querySelectorAll('.admin-nav-item').forEach(btn => {
          btn.classList.toggle('ativo', btn.dataset.tab === tab);
        });
        this['load' + tab.charAt(0).toUpperCase() + tab.slice(1)]();
      },

      // ======================== DASHBOARD ========================

      async loadDashboard() {
        const el = document.getElementById('adminContent');
        el.innerHTML = '<div class="admin-loading">Carregando...</div>';

        try {
          const [produtos, pedidos, usuarios, clientes] = await Promise.all([
            api.getProdutos({ limit: 1000 }),
            api.getPedidos({ limit: 1000 }),
            api.getUsuarios({ limit: 1000 }),
            api.getClientes({ limit: 1000 }).catch(() => ({ clientes: [] })),
          ]);

          const totalProdutos = produtos.produtos?.length || 0;
          const totalPedidos = pedidos.pedidos?.length || 0;
          const totalUsuarios = usuarios.usuarios?.length || 0;
          const totalClientes = clientes.clientes?.length || 0;
          const valorTotal = pedidos.pedidos?.reduce((sum, p) => sum + (parseFloat(p.valor_total) || 0), 0) || 0;
          const pedidosPendentes = pedidos.pedidos?.filter(p => p.status === 'pendente').length || 0;
          this._lastPaidCount = pedidos.pedidos?.filter(p => p.status === 'Pago').length || 0;

          el.innerHTML = `
            <div class="admin-card-header">
              <h2 class="admin-card-title">Dashboard</h2>
            </div>

            <div class="admin-stats">
              <div class="admin-stat">
                <div class="admin-stat-label">Produtos</div>
                <div class="admin-stat-value">${totalProdutos}</div>
                <div class="admin-stat-sub">cadastrados</div>
              </div>
              <div class="admin-stat">
                <div class="admin-stat-label">Pedidos</div>
                <div class="admin-stat-value">${totalPedidos}</div>
                <div class="admin-stat-sub">${pedidosPendentes} pendentes</div>
              </div>
              <div class="admin-stat">
                <div class="admin-stat-label">Usuarios</div>
                <div class="admin-stat-value">${totalUsuarios}</div>
                <div class="admin-stat-sub">no sistema</div>
              </div>
              <div class="admin-stat">
                <div class="admin-stat-label">Receita Total</div>
                <div class="admin-stat-value">${api.formatarMoeda(valorTotal)}</div>
                <div class="admin-stat-sub">${totalPedidos} pedidos</div>
              </div>
            </div>

            <div class="admin-card">
              <div class="admin-card-header">
                <h3 class="admin-card-title">Pedidos Recentes</h3>
              </div>
              ${this._renderPedidosTable(pedidos.pedidos?.slice(-5).reverse() || [])}
            </div>
          `;
        } catch (err) {
          el.innerHTML = `<div class="admin-card"><div class="admin-empty"><p>Erro ao carregar dashboard: ${err.message}</p></div></div>`;
        }
      },

      // ======================== PRODUTOS ========================

      async loadProdutos() {
        const el = document.getElementById('adminContent');
        el.innerHTML = '<div class="admin-loading">Carregando produtos...</div>';

        try {
          const data = await api.getProdutos({ limit: 1000 });
          this._data.produtos = data.produtos || [];

          el.innerHTML = `
            <div class="admin-card">
              <div class="admin-card-header">
                <h3 class="admin-card-title">Produtos <span class="admin-card-count">(${this._data.produtos.length})</span></h3>
                <button class="admin-btn-primary" onclick="Admin.openProdutoModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Adicionar Produto
                </button>
              </div>
              <div class="admin-search">
                <input type="text" placeholder="Buscar produto..." oninput="Admin.filtrarProdutos(this.value)">
              </div>
              <div id="produtosTable">
                ${this._renderProdutosTable(this._data.produtos)}
              </div>
            </div>
          `;
        } catch (err) {
          el.innerHTML = `<div class="admin-card"><div class="admin-empty"><p>Erro: ${err.message}</p></div></div>`;
        }
      },

      _renderProdutosTable(produtos) {
        if (produtos.length === 0) {
          return '<div class="admin-empty"><p>Nenhum produto encontrado.</p></div>';
        }
        return `
          <table class="admin-table">
            <thead>
              <tr>
                <th></th>
                <th>Nome</th>
                <th>Preco</th>
                <th>Tamanho</th>
                <th>Estoque</th>
                <th style="width:100px"></th>
              </tr>
            </thead>
            <tbody>
              ${produtos.map(p => `
                <tr>
                  <td>
                    <div class="cel-img">
                      ${p.imagem ? `<img src="${p.imagem}" alt="${p.nome}">` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`}
                    </div>
                  </td>
                  <td><strong>${p.nome}</strong></td>
                  <td>
                    ${p.preco_promocional ? `
                      <span class="preco-promoco">${api.formatarMoeda(p.preco_promocional)}</span>
                      <span class="preco-riscado">${api.formatarMoeda(p.preco)}</span>
                    ` : api.formatarMoeda(p.preco)}
                  </td>
                  <td>${(p.tamanhos && p.tamanhos.length) ? p.tamanhos.map(t => t.tamanho).join(', ') : (p.tamanho || '—')}</td>
                  <td>${p.stock}</td>
                  <td>
                    <div class="admin-actions">
                      <button class="admin-btn-icon" onclick="Admin.openProdutoModal(${p.id})" title="Editar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      </button>
                      <button class="admin-btn-icon deletar" onclick="Admin.deletarProduto(${p.id})" title="Deletar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      },

      filtrarProdutos(termo) {
        const filtrados = this._data.produtos.filter(p =>
          p.nome.toLowerCase().includes(termo.toLowerCase())
        );
        document.getElementById('produtosTable').innerHTML = this._renderProdutosTable(filtrados);
      },

      openProdutoModal(id = null) {
        const produto = id ? this._data.produtos.find(p => p.id === id) : null;
        const titulo = produto ? 'Editar Produto' : 'Adicionar Produto';
        const tamanhos = (produto?.tamanhos && produto.tamanhos.length) ? produto.tamanhos : (produto?.tamanho ? [{ tamanho: produto.tamanho, stock: produto.stock, preco: null }] : []);

        document.getElementById('adminModalTitle').textContent = titulo;
        document.getElementById('adminModalBody').innerHTML = `
          <form id="produtoForm" onsubmit="Admin.salvarProduto(event, ${id})">
            <div class="form-group">
              <label class="form-label">Nome *</label>
              <input type="text" id="prodNome" required value="${produto?.nome ? produto.nome.replace(/"/g, '&quot;') : ''}" placeholder="Nome do produto">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Preco (R$) *</label>
                <input type="number" step="0.01" min="0" id="prodPreco" required value="${produto?.preco ?? ''}" placeholder="0.00">
              </div>
              <div class="form-group">
                <label class="form-label">Preco Promocional (R$)</label>
                <input type="number" step="0.01" min="0" id="prodPrecoPromocional" value="${produto?.preco_promocional ?? ''}" placeholder="0.00">
                <small class="form-hint">Deixe vazio para sem desconto</small>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Tamanhos e Estoque *</label>
              <div id="tamanhosContainer"></div>

            </div>
            <div class="form-group">
              <label class="form-label">Imagens</label>
              <div id="imagesGrid" class="images-grid"></div>
              <button type="button" class="admin-btn-secondary" onclick="document.getElementById('prodImagensFile').click()">+ Adicionar imagens</button>
              <input type="file" id="prodImagensFile" accept="image/jpeg,image/png,image/webp" multiple style="display:none" onchange="Admin.handleImagesSelect(event)">
              <small class="form-hint">Selecione varias imagens (a primeira sera a capa). No app, arraste para o lado para ver todas.</small>
            </div>
          </form>
        `;

        this._images = (produto?.imagens && produto.imagens.length) ? produto.imagens.map(u => ({ url: u, file: null })) : (produto?.imagem ? [{ url: produto.imagem, file: null }] : []);
        this.renderImagesGrid();
        this.renderTamanhos(tamanhos);

        document.getElementById('adminModalFooter').innerHTML = `
          <button class="btn btn-ghost" onclick="Admin.closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="document.getElementById('produtoForm').requestSubmit()">${produto ? 'Salvar' : 'Criar'}</button>
        `;
        document.getElementById('adminModal').classList.add('ativo');
      },

      renderTamanhos(tamanhos) {
        const container = document.getElementById('tamanhosContainer');
        const lista = tamanhos.length ? tamanhos : [{ tamanho: '', stock: '', preco: '' }];
        container.innerHTML = lista.map((t, i) => `
          <div class="tamanho-linha" data-idx="${i}">
            <select class="tamanho-select" data-field="tamanho">
              <option value="">Tam</option>
              <option value="P" ${t.tamanho === 'P' ? 'selected' : ''}>P</option>
              <option value="M" ${t.tamanho === 'M' ? 'selected' : ''}>M</option>
              <option value="G" ${t.tamanho === 'G' ? 'selected' : ''}>G</option>
              <option value="GG" ${t.tamanho === 'GG' ? 'selected' : ''}>GG</option>
              <option value="XG" ${t.tamanho === 'XG' ? 'selected' : ''}>XG</option>
            </select>
            <input type="number" class="tamanho-stock" min="0" data-field="stock" value="${t.stock ?? ''}" placeholder="Estoque">
            <button type="button" class="admin-btn-icon deletar" onclick="Admin.removeTamanhoLinha(${i})" title="Remover">&times;</button>
          </div>
        `).join('');
      },

      addTamanhoLinha() {
        const container = document.getElementById('tamanhosContainer');
        const idx = container.children.length;
        const linha = document.createElement('div');
        linha.className = 'tamanho-linha';
        linha.dataset.idx = idx;
        linha.innerHTML = `
          <select class="tamanho-select" data-field="tamanho">
            <option value="">Tam</option>
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
            <option value="GG">GG</option>
            <option value="XG">XG</option>
          </select>
          <input type="number" class="tamanho-stock" min="0" data-field="stock" placeholder="Estoque">
          <button type="button" class="admin-btn-icon deletar" onclick="Admin.removeTamanhoLinha(${idx})" title="Remover">&times;</button>
        `;
        container.appendChild(linha);
      },

      removeTamanhoLinha(idx) {
        const container = document.getElementById('tamanhosContainer');
        if (container.children.length <= 1) {
          Componentes.toast('Produto precisa de pelo menos um tamanho.', 'error');
          return;
        }
        const linha = container.querySelector(`[data-idx="${idx}"]`);
        if (linha) linha.remove();
        container.querySelectorAll('.tamanho-linha').forEach((el, i) => el.dataset.idx = i);
      },

      _coletarTamanhos() {
        const container = document.getElementById('tamanhosContainer');
        const tamanhos = [];
        container.querySelectorAll('.tamanho-linha').forEach(el => {
          const tam = el.querySelector('[data-field="tamanho"]').value.trim();
          const stock = parseInt(el.querySelector('[data-field="stock"]').value);
          if (!tam) return;
          const precoStr = el.querySelector('[data-field="preco"]');
          const preco = precoStr && precoStr.value !== '' ? parseFloat(precoStr.value) : null;
          tamanhos.push({ tamanho: tam, stock: isNaN(stock) ? 0 : stock, preco });
        });
        return tamanhos;
      },

      async salvarProduto(e, id) {
        e.preventDefault();

        const tamanhos = this._coletarTamanhos();
        if (tamanhos.length === 0) {
          Componentes.toast('Adicione pelo menos um tamanho com estoque.', 'error');
          return;
        }

        if (!this._images || this._images.length === 0) {
          Componentes.toast('Adicione pelo menos uma imagem.', 'error');
          return;
        }

        let imagens;
        try {
          imagens = await this._uploadNovasImagens();
        } catch (err) {
          Componentes.toast('Erro ao enviar imagem: ' + err.message, 'error');
          return;
        }

        const precoprom = document.getElementById('prodPrecoPromocional').value;
        const dados = {
          nome: document.getElementById('prodNome').value.trim(),
          preco: parseFloat(document.getElementById('prodPreco').value),
          preco_promocional: precoprom !== '' ? parseFloat(precoprom) : null,
          imagem: imagens[0] || null,
          imagens,
          tamanhos,
        };

        try {
          if (id) {
            await api.updateProduto(id, dados);
            Componentes.toast('Produto atualizado!', 'success');
          } else {
            await api.createProduto(dados);
            Componentes.toast('Produto criado!', 'success');
          }
          this.closeModal();
          await this.loadProdutos();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      async _uploadNovasImagens() {
        const urls = [];
        for (const img of this._images || []) {
          if (img.url) {
            urls.push(img.url);
          } else if (img.file) {
            const r = await api.uploadImagem(img.file);
            urls.push(r.url);
          }
        }
        return urls;
      },

      renderImagesGrid() {
        const grid = document.getElementById('imagesGrid');
        if (!grid) return;
        grid.innerHTML = (this._images || []).map((img, i) => {
          const src = img.url || (img.preview || '');
          if (!src) return '';
          return `
            <div class="image-item" data-idx="${i}">
              <img src="${src}" alt="Imagem ${i + 1}">
              ${i === 0 ? '<span class="image-capa">Capa</span>' : ''}
              <button type="button" class="upload-remove" onclick="Admin.removeImageAt(${i})" title="Remover">&times;</button>
            </div>
          `;
        }).join('');
      },

      handleImagesSelect(event) {
        const files = Array.from(event.target.files || []);
        this.addImages(files);
        event.target.value = '';
      },

      addImages(files) {
        if (!this._images) this._images = [];
        for (const file of files) {
          if (!file.type.match(/^image\/(jpeg|png|webp)$/)) {
            Componentes.toast('Formato invalido (' + file.name + '). Use JPG, PNG ou WebP.', 'error');
            continue;
          }
          if (file.size > 5 * 1024 * 1024) {
            Componentes.toast('Arquivo muito grande: ' + file.name + ' (max 5MB).', 'error');
            continue;
          }
          const entry = { url: null, file, preview: '' };
          const reader = new FileReader();
          reader.onload = (e) => {
            entry.preview = e.target.result;
            this.renderImagesGrid();
          };
          reader.readAsDataURL(file);
          this._images.push(entry);
        }
        this.renderImagesGrid();
      },

      removeImageAt(idx) {
        if (!this._images || idx < 0 || idx >= this._images.length) return;
        this._images.splice(idx, 1);
        this.renderImagesGrid();
      },

      async deletarProduto(id) {
        const _ok = await new Promise(res=>{ Admin.confirmarExclusao('Deletar produto','Tem certeza que deseja deletar este produto?', res); }); if(!_ok) return;
        try {
          await api.deleteProduto(id);
          Componentes.toast('Produto deletado.', 'success');
          await this.loadProdutos();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      confirmarExclusao(titulo, mensagem, callback) {
        const modal = document.getElementById('adminModal');
        document.getElementById('adminModalTitle').textContent = titulo;
        document.getElementById('adminModalBody').innerHTML = `
          <div class="confirm-delete">
            <div class="confirm-delete-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.9 2.9 17a2 2 0 0 0 1.74 3h14.72A2 2 0 0 0 21.1 17L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
            </div>
            <p class="confirm-delete-lead">Esta ação não poderá ser desfeita.</p>
            <p class="confirm-delete-text">${mensagem}</p>
          </div>`;
        document.getElementById('adminModalFooter').innerHTML = `
          <button type="button" class="btn btn-ghost" onclick="Admin.responderExclusao(false)">Cancelar</button>
          <button type="button" class="admin-btn-danger" onclick="Admin.responderExclusao(true)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Excluir definitivamente
          </button>`;
        this._resolverExclusao = callback;
        modal.classList.add('modal-exclusao', 'ativo');
      },

      responderExclusao(confirmar) {
        const resolver = this._resolverExclusao;
        this._resolverExclusao = null;
        const modal = document.getElementById('adminModal');
        modal.classList.remove('ativo', 'modal-exclusao');
        if (resolver) resolver(confirmar);
      },

      // ======================== PEDIDOS ========================

      _pedidosAba: 'todos',
      async loadPedidos() {
        const el = document.getElementById('adminContent');
        el.innerHTML = '<div class="admin-loading">Carregando pedidos...</div>';

        try {
          const data = await api.getPedidos({ limit: 1000 });
          this._data.pedidos = data.pedidos || [];
          if(!this._pedidosAba) this._pedidosAba='todos';

          const counts = {todos:this._data.pedidos.length, pendente:0, pago:0, enviado:0, entregue:0, recusado:0};
          this._data.pedidos.forEach(p=>{
            const s=(p.status||'').toLowerCase();
            if(s==='pendente') counts.pendente++;
            else if(s==='pago' || s==='aprovado' || s==='approved') counts.pago++;
            else if(s==='enviado') counts.enviado++;
            else if(s==='entregue') counts.entregue++;
            else if(s==='recusado' || s==='cancelado' || s==='cancelled') counts.recusado++;
          });

          el.innerHTML = `
            <div class="admin-card">
              <div class="admin-card-header">
                <h3 class="admin-card-title">Pedidos <span class="admin-card-count">(${this._data.pedidos.length})</span></h3>
              </div>
              <div class="pedidos-tabs" id="pedidosTabs">
                <button class="pedido-tab ${this._pedidosAba==='todos'?'ativo':''}" onclick="Admin.trocarAbaPedidos('todos')">Todos <span class="count">${counts.todos}</span></button>
                <button class="pedido-tab ${this._pedidosAba==='pendente'?'ativo':''}" onclick="Admin.trocarAbaPedidos('pendente')">Pendente <span class="count">${counts.pendente}</span></button>
                <button class="pedido-tab ${this._pedidosAba==='pago'?'ativo':''}" onclick="Admin.trocarAbaPedidos('pago')">Pago <span class="count">${counts.pago}</span></button>
                <button class="pedido-tab ${this._pedidosAba==='enviado'?'ativo':''}" onclick="Admin.trocarAbaPedidos('enviado')">Enviado <span class="count">${counts.enviado}</span></button>
                <button class="pedido-tab ${this._pedidosAba==='entregue'?'ativo':''}" onclick="Admin.trocarAbaPedidos('entregue')">Entregue <span class="count">${counts.entregue}</span></button>
                <button class="pedido-tab ${this._pedidosAba==='recusado'?'ativo':''}" onclick="Admin.trocarAbaPedidos('recusado')">Recusado <span class="count">${counts.recusado}</span></button>
              </div>
              <div class="admin-search">
                <input type="text" id="pedidosBusca" placeholder="Buscar por ID do pedido..." oninput="Admin.filtrarPedidos(this.value)">
              </div>
              <div id="pedidosTable">
                ${this._renderPedidosTable(this._getPedidosFiltrados())}
              </div>
            </div>
          `;
        } catch (err) {
          el.innerHTML = `<div class="admin-card"><div class="admin-empty"><p>Erro: ${err.message}</p></div></div>`;
        }
      },
      _getPedidosFiltrados(){
        let lista=this._data.pedidos||[];
        const aba=this._pedidosAba||'todos';
        if(aba!=='todos'){
          lista=lista.filter(p=>{
            const s=(p.status||'').toLowerCase();
            if(aba==='pendente') return s==='pendente';
            if(aba==='pago') return ['pago','aprovado','approved'].includes(s);
            if(aba==='enviado') return s==='enviado';
            if(aba==='entregue') return s==='entregue';
            if(aba==='recusado') return ['recusado','cancelado','cancelled'].includes(s);
            return true;
          });
        }
        const termo=(document.getElementById('pedidosBusca')?.value||'').toLowerCase().trim();
        if(termo){
          lista=lista.filter(p=> (p.id_pedido||String(p.id)).toLowerCase().includes(termo) || String(p.cliente_id).includes(termo));
        }
        return lista;
      },
      trocarAbaPedidos(aba){
        this._pedidosAba=aba;
        document.querySelectorAll('#pedidosTabs .pedido-tab').forEach(b=> b.classList.toggle('ativo', b.textContent.toLowerCase().includes(aba) || (aba==='todos' && b.textContent.includes('Todos'))));
        // re-render simples
        const tabBtns=document.querySelectorAll('#pedidosTabs .pedido-tab');
        tabBtns.forEach(btn=>{
          const t=btn.textContent.toLowerCase();
          if(aba==='todos' && t.includes('todos')) btn.classList.add('ativo'); else btn.classList.toggle('ativo', t.startsWith(aba));
        });
        document.getElementById('pedidosTable').innerHTML=this._renderPedidosTable(this._getPedidosFiltrados());
      },

      _renderPedidosTable(pedidos) {
        if (pedidos.length === 0) {
          return '<div class="admin-empty"><p>Nenhum pedido encontrado.</p></div>';
        }
        return `
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID Pedido</th>
                <th>Cliente</th>
                <th>Status</th>
                <th>Rastreio</th>
                <th>Valor Total</th>
                <th>Endereco</th>
                <th style="width:100px"></th>
              </tr>
            </thead>
            <tbody>
              ${pedidos.map(p => `
                <tr>
                  <td><strong>${p.id_pedido || '#' + p.id}</strong></td>
                  <td>${p.cliente_id}</td>
                  <td><span class="admin-badge ${String(p.status||'').toLowerCase()}">${p.status}</span></td>

                  <td>
                    <div class="admin-actions">
                      <button class="admin-btn-icon" onclick="Admin.openPedidoModal('${p.id_pedido || p.id}')" title="Editar Status">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      </button>
                      <button class="admin-btn-icon deletar" onclick="Admin.deletarPedido('${p.id_pedido || p.id}')" title="Deletar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      },

      filtrarPedidos(termo) {
        const filtrados = this._data.pedidos.filter(p =>
          (p.id_pedido || String(p.id)).toLowerCase().includes(termo.toLowerCase()) ||
          String(p.cliente_id).includes(termo)
        );
        document.getElementById('pedidosTable').innerHTML = this._renderPedidosTable(filtrados);
      },

      async salvarPedido(idPedido) {
        const status = document.getElementById('pedidoStatus').value;
        const codigo_rastreio = document.getElementById('pedidoRastreio').value.trim() || null;
        const transportadora = document.getElementById('pedidoTransportadora').value;
        const payload = { status, transportadora };
        if (codigo_rastreio) payload.codigo_rastreio = codigo_rastreio;
        try {
          await api.updatePedido(idPedido, payload);
          if (codigo_rastreio) {
            Componentes.toast('Código salvo! Cliente notificado automaticamente via WhatsApp e e-mail.', 'success');
          } else {
            Componentes.toast('Pedido atualizado!', 'success');

          this.closeModal();
          await this.loadPedidos();
        } catch (err) {
          Componentes.toast(err.message, 'error');

      },

      async deletarPedido(idPedido) {
        const _ok = await new Promise(res=>{ Admin.confirmarExclusao('Deletar pedido','Tem certeza que deseja deletar este pedido?', res); }); if(!_ok) return;
        try {
          await api.deletePedido(idPedido);
          Componentes.toast('Pedido deletado.', 'success');
          await this.loadPedidos();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      // ======================== USUARIOS ========================

      async loadUsuarios() {
        const el = document.getElementById('adminContent');
        el.innerHTML = '<div class="admin-loading">Carregando usuarios...</div>';

        try {
          const data = await api.getUsuarios({ limit: 1000 });
          this._data.usuarios = data.usuarios || [];

          el.innerHTML = `
            <div class="admin-card">
              <div class="admin-card-header">
                <h3 class="admin-card-title">Usuarios <span class="admin-card-count">(${this._data.usuarios.length})</span></h3>
                <button class="admin-btn-primary" onclick="Admin.openUsuarioModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Adicionar Usuario
                </button>
              </div>
              <div class="admin-search">
                <input type="text" placeholder="Buscar usuario..." oninput="Admin.filtrarUsuarios(this.value)">
              </div>
              <div id="usuariosTable">
                ${this._renderUsuariosTable(this._data.usuarios)}
              </div>
            </div>
          `;
        } catch (err) {
          el.innerHTML = `<div class="admin-card"><div class="admin-empty"><p>Erro: ${err.message}</p></div></div>`;
        }
      },

      _renderUsuariosTable(usuarios) {
        if (usuarios.length === 0) {
          return '<div class="admin-empty"><p>Nenhum usuario encontrado.</p></div>';
        }
        return `
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Nome Completo</th>
                <th>Acesso</th>
                <th style="width:100px"></th>
              </tr>
            </thead>
            <tbody>
              ${usuarios.map(u => `
                <tr>
                  <td>${u.id}</td>
                  <td><strong>${u.username}</strong></td>
                  <td>${u.nome_completo || '-'}</td>
                  <td><span class="admin-badge ${u.acesso}">${u.acesso}</span></td>
                  <td>
                    <div class="admin-actions">
                      <button class="admin-btn-icon" onclick="Admin.openUsuarioModal(${u.id})" title="Editar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      </button>
                      <button class="admin-btn-icon deletar" onclick="Admin.deletarUsuario(${u.id})" title="Deletar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      },

      filtrarUsuarios(termo) {
        const filtrados = this._data.usuarios.filter(u =>
          u.username.toLowerCase().includes(termo.toLowerCase()) ||
          (u.nome_completo || '').toLowerCase().includes(termo.toLowerCase())
        );
        document.getElementById('usuariosTable').innerHTML = this._renderUsuariosTable(filtrados);
      },

      openUsuarioModal(id = null) {
        const usuario = id ? this._data.usuarios.find(u => u.id === id) : null;
        const titulo = usuario ? 'Editar Usuario' : 'Adicionar Usuario';

        document.getElementById('adminModalTitle').textContent = titulo;
        document.getElementById('adminModalBody').innerHTML = `
          <form id="usuarioForm" onsubmit="Admin.salvarUsuario(event, ${id})">
            <div class="form-group">
              <label class="form-label">Username (Email) *</label>
              <input type="email" id="usrUsername" required value="${usuario?.username || ''}" placeholder="email@exemplo.com">
            </div>
            <div class="form-group">
              <label class="form-label">Nome Completo *</label>
              <input type="text" id="usrNome" required value="${usuario?.nome_completo || ''}" placeholder="Nome completo">
            </div>
            <div class="form-group">
              <label class="form-label">${usuario ? 'Nova Senha (deixe vazio para manter)' : 'Senha *'}</label>
              <input type="password" id="usrSenha" ${usuario ? '' : 'required'} placeholder="Minimo 6 caracteres" minlength="6">
            </div>
            <div class="form-group">
              <label class="form-label">Nivel de Acesso *</label>
              <select id="usrAcesso" required>
                <option value="comum" ${usuario?.acesso === 'comum' ? 'selected' : ''}>Comum</option>
                <option value="admin" ${usuario?.acesso === 'admin' ? 'selected' : ''}>Admin</option>
              </select>
            </div>
          </form>
        `;
        document.getElementById('adminModalFooter').innerHTML = `
          <button class="btn btn-ghost" onclick="Admin.closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="document.getElementById('usuarioForm').requestSubmit()">${usuario ? 'Salvar' : 'Criar'}</button>
        `;
        document.getElementById('adminModal').classList.add('ativo');
      },

      async salvarUsuario(e, id) {
        e.preventDefault();
        const username = document.getElementById('usrUsername').value.trim();
        const nome_completo = document.getElementById('usrNome').value.trim();
        const senha = document.getElementById('usrSenha').value;
        const acesso = document.getElementById('usrAcesso').value;

        try {
          if (id) {
            const dados = { username, nome_completo, acesso };
            if (senha) dados.password = senha;
            await api.updateUsuario(id, dados);
            Componentes.toast('Usuario atualizado!', 'success');
          } else {
            if (!senha) {
              Componentes.toast('Senha e obrigatoria para novos usuarios.', 'error');
              return;
            }
            await api.createUsuario({ username, password: senha, acesso, nome_completo });
            Componentes.toast('Usuario criado!', 'success');
          }
          this.closeModal();
          await this.loadUsuarios();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      async deletarUsuario(id) {
        const _ok = await new Promise(res=>{ Admin.confirmarExclusao('Deletar usuário','Tem certeza que deseja deletar este usuário?', res); }); if(!_ok) return;
        try {
          await api.deleteUsuario(id);
          Componentes.toast('Usuario deletado.', 'success');
          await this.loadUsuarios();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      // ======================== CLIENTES ========================

      async loadClientes() {
        const el = document.getElementById('adminContent');
        el.innerHTML = '<div class="admin-loading">Carregando clientes...</div>';

        try {
          const data = await api.getClientes({ limit: 1000 }).catch(() => ({ clientes: [] }));
          this._data.clientes = data.clientes || [];

          el.innerHTML = `
            <div class="admin-card">
              <div class="admin-card-header">
                <h3 class="admin-card-title">Clientes <span class="admin-card-count">(${this._data.clientes.length})</span></h3>
                <button class="admin-btn-primary" onclick="Admin.openClienteModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Adicionar Cliente
                </button>
              </div>
              <div class="admin-search">
                <input type="text" placeholder="Buscar cliente..." oninput="Admin.filtrarClientes(this.value)">
              </div>
              <div id="clientesTable">
                ${this._renderClientesTable(this._data.clientes)}
              </div>
            </div>
          `;
        } catch (err) {
          el.innerHTML = `<div class="admin-card"><div class="admin-empty"><p>Erro: ${err.message}</p></div></div>`;
        }
      },

      _renderClientesTable(clientes) {
        if (clientes.length === 0) {
          return '<div class="admin-empty"><p>Nenhum cliente encontrado.</p></div>';
        }
        return `
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>CPF</th>
                <th style="width:100px"></th>
              </tr>
            </thead>
            <tbody>
              ${clientes.map(c => `
                <tr>
                  <td>${c.id}</td>
                  <td><strong>${c.nome}</strong></td>
                  <td>${c.email}</td>
                  <td>${c.telefone || '-'}</td>
                  <td>${c.cpf || '-'}</td>
                  <td>
                    <div class="admin-actions">
                      <button class="admin-btn-icon" onclick="Admin.openClienteModal(${c.id})" title="Editar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      </button>
                      <button class="admin-btn-icon deletar" onclick="Admin.deletarCliente(${c.id})" title="Deletar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      },

      filtrarClientes(termo) {
        const filtrados = this._data.clientes.filter(c =>
          c.nome.toLowerCase().includes(termo.toLowerCase()) ||
          c.email.toLowerCase().includes(termo.toLowerCase()) ||
          (c.cpf || '').includes(termo)
        );
        document.getElementById('clientesTable').innerHTML = this._renderClientesTable(filtrados);
      },

      openClienteModal(id = null) {
        const cliente = id ? this._data.clientes.find(c => c.id === id) : null;
        const titulo = cliente ? 'Editar Cliente' : 'Adicionar Cliente';

        document.getElementById('adminModalTitle').textContent = titulo;
        document.getElementById('adminModalBody').innerHTML = `
          <form id="clienteForm" onsubmit="Admin.salvarCliente(event, ${id})">
            <div class="form-group">
              <label class="form-label">Nome *</label>
              <input type="text" id="cliNome" required value="${cliente?.nome || ''}" placeholder="Nome completo">
            </div>
            <div class="form-group">
              <label class="form-label">Email *</label>
              <input type="email" id="cliEmail" required value="${cliente?.email || ''}" placeholder="email@exemplo.com">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Telefone</label>
                <input type="tel" id="cliTelefone" value="${cliente?.telefone || ''}" placeholder="(11) 99999-9999" maxlength="15">
              </div>
              <div class="form-group">
                <label class="form-label">CPF</label>
                <input type="text" id="cliCpf" value="${cliente?.cpf || ''}" placeholder="000.000.000-00" maxlength="14">
              </div>
            </div>
          </form>
        `;
        document.getElementById('adminModalFooter').innerHTML = `
          <button class="btn btn-ghost" onclick="Admin.closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="document.getElementById('clienteForm').requestSubmit()">${cliente ? 'Salvar' : 'Criar'}</button>
        `;
        document.getElementById('adminModal').classList.add('ativo');
      },

      async salvarCliente(e, id) {
        e.preventDefault();
        const dados = {
          nome: document.getElementById('cliNome').value.trim(),
          email: document.getElementById('cliEmail').value.trim(),
          telefone: document.getElementById('cliTelefone').value.trim(),
          cpf: document.getElementById('cliCpf').value.trim(),
        };

        try {
          if (id) {
            await api.updateCliente(id, dados);
            Componentes.toast('Cliente atualizado!', 'success');
          } else {
            await api.createCliente(dados);
            Componentes.toast('Cliente criado!', 'success');
          }
          this.closeModal();
          await this.loadClientes();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      async deletarCliente(id) {
        const _ok = await new Promise(res=>{ Admin.confirmarExclusao('Deletar cliente','Tem certeza que deseja deletar este cliente?', res); }); if(!_ok) return;
        try {
          await api.deleteCliente(id);
          Componentes.toast('Cliente deletado.', 'success');
          await this.loadClientes();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      // ======================== ADMINS ========================

      async loadAdmins() {
        const el = document.getElementById('adminContent');
        el.innerHTML = '<div class="admin-loading">Carregando admins...</div>';

        try {
          const data = await api.getAdmins({ limit: 1000 });
          this._data.admins = data.admins || [];

          el.innerHTML = `
            <div class="admin-card">
              <div class="admin-card-header">
                <h3 class="admin-card-title">Admins <span class="admin-card-count">(${this._data.admins.length})</span></h3>
                <button class="admin-btn-primary" onclick="Admin.openAdminModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Adicionar Admin
                </button>
              </div>
              <div class="admin-search">
                <input type="text" placeholder="Buscar admin..." oninput="Admin.filtrarAdmins(this.value)">
              </div>
              <div id="adminsTable">
                ${this._renderAdminsTable(this._data.admins)}
              </div>
            </div>
          `;
        } catch (err) {
          el.innerHTML = `<div class="admin-card"><div class="admin-empty"><p>Erro: ${err.message}</p></div></div>`;
        }
      },

      _renderAdminsTable(admins) {
        if (admins.length === 0) {
          return '<div class="admin-empty"><p>Nenhum admin encontrado.</p></div>';
        }
        return `
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Nome Completo</th>
                <th style="width:100px"></th>
              </tr>
            </thead>
            <tbody>
              ${admins.map(a => `
                <tr>
                  <td>${a.id}</td>
                  <td><strong>${a.username}</strong></td>
                  <td>${a.nome_completo || '-'}</td>
                  <td>
                    <div class="admin-actions">
                      <button class="admin-btn-icon" onclick="Admin.openAdminModal(${a.id})" title="Editar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      </button>
                      <button class="admin-btn-icon deletar" onclick="Admin.deletarAdmin(${a.id})" title="Deletar">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      },

      filtrarAdmins(termo) {
        const filtrados = this._data.admins.filter(a =>
          a.username.toLowerCase().includes(termo.toLowerCase()) ||
          (a.nome_completo || '').toLowerCase().includes(termo.toLowerCase())
        );
        document.getElementById('adminsTable').innerHTML = this._renderAdminsTable(filtrados);
      },

      openAdminModal(id = null) {
        const admin = id ? this._data.admins.find(a => a.id === id) : null;
        const titulo = admin ? 'Editar Admin' : 'Adicionar Admin';

        document.getElementById('adminModalTitle').textContent = titulo;
        document.getElementById('adminModalBody').innerHTML = `
          <form id="adminForm" onsubmit="Admin.salvarAdmin(event, ${id})">
            <div class="form-group">
              <label class="form-label">Username (Email) *</label>
              <input type="email" id="admUsername" required value="${admin?.username || ''}" placeholder="email@exemplo.com">
            </div>
            <div class="form-group">
              <label class="form-label">Nome Completo *</label>
              <input type="text" id="admNome" required value="${admin?.nome_completo || ''}" placeholder="Nome completo">
            </div>
            <div class="form-group">
              <label class="form-label">${admin ? 'Nova Senha (deixe vazio para manter)' : 'Senha *'}</label>
              <input type="password" id="admSenha" ${admin ? '' : 'required'} placeholder="Minimo 6 caracteres" minlength="6">
            </div>
          </form>
        `;
        document.getElementById('adminModalFooter').innerHTML = `
          <button class="btn btn-ghost" onclick="Admin.closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="document.getElementById('adminForm').requestSubmit()">${admin ? 'Salvar' : 'Criar'}</button>
        `;
        document.getElementById('adminModal').classList.add('ativo');
      },

      async salvarAdmin(e, id) {
        e.preventDefault();
        const username = document.getElementById('admUsername').value.trim();
        const nome_completo = document.getElementById('admNome').value.trim();
        const senha = document.getElementById('admSenha').value;

        try {
          if (id) {
            const dados = { username, nome_completo };
            if (senha) dados.password = senha;
            await api.updateAdmin(id, dados);
            Componentes.toast('Admin atualizado!', 'success');
          } else {
            if (!senha) {
              Componentes.toast('Senha e obrigatoria para novos admins.', 'error');
              return;
            }
            await api.createAdmin({ username, password: senha, nome_completo });
            Componentes.toast('Admin criado!', 'success');
          }
          this.closeModal();
          await this.loadAdmins();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      async deletarAdmin(id) {
        const _ok = await new Promise(res=>{ Admin.confirmarExclusao('Deletar admin','Tem certeza que deseja deletar este admin?', res); }); if(!_ok) return;
        try {
          await api.deleteAdmin(id);
          Componentes.toast('Admin deletado.', 'success');
          await this.loadAdmins();
        } catch (err) {
          Componentes.toast(err.message, 'error');
        }
      },

      // ======================== MODAL ========================

      closeModal() {
        if (this._resolverExclusao) {
          this.responderExclusao(false);
          return;
        }
        document.getElementById('adminModal').classList.remove('ativo', 'modal-exclusao');
      },
    };

    Admin.init();
  </script>
</body>
</html>
