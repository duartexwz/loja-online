<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Compras - JP Croco</title>
  <link rel="stylesheet" href="/styles/base.css?v=13">
  <link rel="stylesheet" href="/styles/loja.css?v=13">
  <style>
    :root{--croc:#111;--gold:#c6a15a;--ok:#137333;--okbg:#e6f4ea;--info:#1a73e8;--infobg:#e8f0fe;--warn:#b7791f;--warnbg:#fef7e0;--danger:#c5221f;--dangerbg:#fce8e6}
    .compras-hero{background:linear-gradient(135deg,#111 0%,#2a2a2a 100%);color:#fff;padding:28px 0 20px;margin-bottom:24px}
    .compras-hero .container{max-width:1000px;margin:0 auto;padding:0 16px}
    .compras-hero h1{font-size:1.7rem;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:10px}
    .compras-hero p{opacity:.75;font-size:.95rem;margin:0}
    .compras-container{max-width:1000px;margin:0 auto;padding:0 16px 40px}
    .filtros{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
    .filtro-chip{border:1px solid #e5e5e5;background:#fff;padding:7px 14px;border-radius:999px;font-size:.85rem;cursor:pointer;transition:.15s}
    .filtro-chip.ativo{background:#111;color:#fff;border-color:#111}
    .filtro-chip:hover{border-color:#111}
    /* card */
    .compra-card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:.15s}
    .compra-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)}
    .compra-top{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #f2f2f2}
    .pedido-id{font-weight:700;letter-spacing:.02em}
    .pedido-data{color:#777;font-size:.85rem}
    .badges{display:flex;gap:8px;align-items:center}
    .badge{padding:6px 10px;border-radius:999px;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
    .badge-pago{background:var(--okbg);color:var(--ok)}
    .badge-enviado{background:var(--infobg);color:var(--info)}
    .badge-pendente{background:var(--warnbg);color:var(--warn)}
    .badge-entregue{background:#e6f4ea;color:#0d652d}
    .badge-recusado{background:var(--dangerbg);color:var(--danger)}
    .compra-body{padding:16px 18px;display:grid;grid-template-columns:1fr 320px;gap:18px}
    @media(max-width:820px){.compra-body{grid-template-columns:1fr}}
    .itens-list{display:flex;flex-direction:column;gap:10px}
    .item-row{display:flex;gap:12px;align-items:center;background:#fafafa;border:1px solid #f0f0f0;border-radius:12px;padding:10px}
    .item-thumb{width:56px;height:56px;border-radius:10px;background:#eee;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .item-thumb img{width:100%;height:100%;object-fit:cover}
    .item-info{flex:1;min-width:0}
    .item-nome{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-meta{color:#666;font-size:.82rem}
    .resumo-box{background:#fafafa;border:1px solid #f0f0f0;border-radius:12px;padding:14px}
    .resumo-linha{display:flex;justify-content:space-between;font-size:.9rem;margin:6px 0}
    .resumo-total{font-weight:700;font-size:1.05rem;border-top:1px dashed #ddd;padding-top:8px;margin-top:8px}
    .endereco{font-size:.85rem;color:#555;background:#fff;border:1px dashed #e5e5e5;border-radius:8px;padding:10px;margin-top:12px}
    /* rastreio */
    .rastreio-box{margin-top:14px;background:linear-gradient(180deg,#f8f9fa,#fff);border:1px solid #eef1f5;border-radius:12px;padding:14px}
    .rastreio-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .codigo-pill{background:#111;color:#fff;padding:6px 10px;border-radius:8px;font-family:monospace;font-size:.85rem;display:inline-flex;align-items:center;gap:8px}
    .btn-copy{border:1px solid #ddd;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.8rem}
    .btn-copy:hover{background:#111;color:#fff;border-color:#111}
    .btn-rastrear{background:#1a73e8;color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .btn-rastrear:hover{background:#1557b0}
    .timeline{margin-top:14px;position:relative;padding-left:22px}
    .timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:#e8eaed}
    .tl-item{position:relative;padding:10px 12px;background:#fff;border:1px solid #eef1f5;border-radius:10px;margin-bottom:10px}
    .tl-item::before{content:'';position:absolute;left:-18px;top:14px;width:10px;height:10px;border-radius:50%;background:#1a73e8;border:2px solid #fff;box-shadow:0 0 0 2px #1a73e8}
    .tl-item.done::before{background:#137333;box-shadow:0 0 0 2px #137333}
    .tl-title{font-weight:600;font-size:.92rem}
    .tl-sub{color:#5f6368;font-size:.82rem}
    .empty{padding:48px 16px;text-align:center;color:#666}
    .empty .icon{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:#f1f3f4;display:flex;align-items:center;justify-content:center}
    .skeleton{animation:pulse 1.4s infinite}
    @keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
    .cta{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
    .btn-primary{background:#111;color:#fff;border:none;padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer}
    .btn-primary:hover{background:#222}
    .btn-ghost{background:#fff;border:1px solid #ddd;padding:10px 16px;border-radius:999px;cursor:pointer}
    .delivery-card{background:#fff;border-radius:16px;padding:18px;border:1px solid #eef1f5;margin-top:12px}
    .delivery-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .delivery-head h4{margin:0;font-size:1.02rem}
    .delivery-head small{color:#666}
    .stepper{display:flex;align-items:flex-start;justify-content:space-between;gap:0;margin:14px 0 8px;position:relative}
    .step{flex:1;text-align:center;position:relative}
    .step-dot{width:18px;height:18px;border-radius:50%;margin:0 auto 8px;background:#e8eaed;border:3px solid #fff;box-shadow:0 0 0 2px #e8eaed}
    .step.ativo .step-dot{background:#1a9e4a;box-shadow:0 0 0 2px #1a9e4a}
    .step.ativo .step-dot::after{content:'';display:block;width:6px;height:6px;background:#fff;border-radius:50%;margin:3px auto}
    .step-line{position:absolute;top:8px;left:50%;right:-50%;height:3px;background:#e8eaed;z-index:0}
    .step.ativo .step-line{background:#1a9e4a}
    .step:last-child .step-line{display:none}
    .step-line.dashed{background:repeating-linear-gradient(90deg,#c8e6c9 0 8px,transparent 8px 14px)}
    .step-label{font-size:.82rem;font-weight:600}
    .step-date{font-size:.75rem;color:#777}
  </style>
</head>
<body>
  <div id="header"></div>
  <div class="compras-hero">
    <div class="container">
      <h1><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c6a15a" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg> Minhas Compras</h1>
      <p>Acompanhe seus pedidos, entrega e rastreio em tempo real — entrega para todo o Brasil via Correios</p>
    </div>
  </div>
  <div class="compras-container">
    <div class="filtros" id="filtros">
      <button class="filtro-chip ativo" data-f="todos" onclick="filtrar('todos')">Todos</button>
      <button class="filtro-chip" data-f="Pago" onclick="filtrar('Pago')">Pagos</button>
      <button class="filtro-chip" data-f="Enviado" onclick="filtrar('Enviado')">Enviados</button>
      <button class="filtro-chip" data-f="pendente" onclick="filtrar('pendente')">Pendentes</button>
    </div>
    <div id="comprasList"><div class="empty skeleton"><div class="icon">⌛</div><p>Carregando suas compras...</p></div></div>
  </div>
  <div id="footer"></div>
  <div id="panels"></div>
  <div id="modal"></div>
<script src="/script/config.js?v=13"></script>
<script src="/script/api.js?v=13"></script>
<script src="/script/cart.js?v=13"></script>
<script src="/script/components.js?v=13"></script>
<script>
let _pedidos=[], _produtosMap=new Map(), _filtro='todos';
async function init(){
  document.getElementById('header').innerHTML=Componentes.renderizarHeader('compras');
  document.getElementById('footer').innerHTML=Componentes.renderizarFooter();
  document.getElementById('panels').innerHTML=Componentes.renderizarPainelSacola()+Componentes.renderizarCheckout();
  document.getElementById('modal').innerHTML=Componentes.renderizarModalSucesso();
  Componentes.init();
  if(!api.isLoggedIn()){ window.location.href='/pages/login.html'; return; }
  try{
    const [data, prods] = await Promise.all([
      api.getMeusPedidos(),
      api.getProdutos({limit:1000}).catch(()=>({produtos:[]})),
    ]);
    (prods.produtos||[]).forEach(p=>_produtosMap.set(p.id,p));
    _pedidos=(data.pedidos||[]).slice().sort((a,b)=> new Date(b.data_pedido||0)-new Date(a.data_pedido||0) || b.id - a.id);
    if(!_pedidos.length){ document.getElementById('comprasList').innerHTML=emptyHTML('Você ainda não tem pedidos','Que tal explorar nossa coleção?','/pages/loja.html','Ver produtos'); return; }
    // pré-carrega itens para todos pedidos em paralelo
    const itensAll = await Promise.all(_pedidos.map(p=> api.getItensPedido({pedido_id:p.id,limit:1000}).then(r=>({pid:p.id, itens:r.itens_pedido||r.itens||[]})).catch(()=>({pid:p.id,itens:[]}))));
    const mapItens=new Map(itensAll.map(x=>[x.pid,x.itens]));
    _pedidos.forEach(p=> p._itens = mapItens.get(p.id)||[]);
    render();
  }catch(err){ document.getElementById('comprasList').innerHTML=`<div class="empty"><p style="color:#c5221f">Erro: ${err.message}</p></div>`; }
}
function emptyHTML(titulo,sub,href,cta){
  return `<div class="empty"><div class="icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.6"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg></div><h3 style="margin:0 0 6px">${titulo}</h3><p style="margin:0 0 14px;color:#666">${sub}</p>${href?`<a class="btn-primary" href="${href}">${cta}</a>`:''}</div>`;
}
function filtrar(f){
  _filtro=f;
  document.querySelectorAll('.filtro-chip').forEach(c=>c.classList.toggle('ativo',c.dataset.f===f));
  render();
}
function badgeCls(s){ const k=s.toLowerCase(); if(k==='pago')return 'badge-pago'; if(k==='enviado')return 'badge-enviado'; if(k==='entregue')return 'badge-entregue'; if(k==='recusado')return 'badge-recusado'; return 'badge-pendente'; }
function badgeIcon(s){ if(s==='Pago')return '✓'; if(s==='Enviado')return '↗'; if(s==='Entregue')return '✔'; if(s==='Recusado')return '✕'; return '•'; }
function render(){
  const lista = _filtro==='todos' ? _pedidos : _pedidos.filter(p=>p.status.toLowerCase()===_filtro.toLowerCase());
  if(!lista.length){ document.getElementById('comprasList').innerHTML=`<div class="empty"><p>Nenhum pedido com status "${ _filtro}"</p></div>`; return; }
  document.getElementById('comprasList').innerHTML = lista.map(p=>{
    const itens=p._itens||[];
    const data = p.data_pedido ? new Date(p.data_pedido).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}) : '';
    const total = api.formatarMoeda(p.valor_total);
    const itensHTML = itens.length ? itens.map(i=>{
      const prod=_produtosMap.get(i.produto_id);
      const img = prod?.imagem ? `<img src="${prod.imagem}" alt="${prod.nome}">` : '👜';
      const nome = prod?.nome || `Produto #${i.produto_id}`;
      return `<div class="item-row"><div class="item-thumb">${prod?.imagem?`<img src="${prod.imagem}" alt="">`:'<span style="font-size:20px">👜</span>'}</div><div class="item-info"><div class="item-nome">${nome}</div><div class="item-meta">${i.quantidade}x • ${i.tamanho?'Tam: '+i.tamanho+' • ':''}${api.formatarMoeda(i.preco_unitario)}</div></div></div>`;
    }).join('') : `<div class="item-row"><div class="item-meta">Itens em processamento...</div></div>`;
    const isDF = p.entrega_tipo && (p.entrega_tipo.includes('Retirada') || p.entrega_tipo.includes('Uber'));
    let rastreio='';
    if(p.codigo_rastreio){
      rastreio=`<div class="rastreio-box" data-pedido-codigo="${p.codigo_rastreio}" data-pedido="${p.id_pedido||p.id}" data-valor="${total}">
        <div class="rastreio-head">
          <div>
            <div style="font-size:.82rem;color:#5f6368">Transportadora • ${p.transportadora||'Correios'}</div>
            <div class="codigo-pill">${p.codigo_rastreio} <button class="btn-copy" onclick="copiar('${p.codigo_rastreio}')">Copiar</button></div>
          </div>
          <button class="btn-rastrear" onclick="rastrear('${p.codigo_rastreio}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> Rastrear em tempo real</button>
        </div>
        <div id="rastreio-${p.codigo_rastreio}" class="timeline" style="display:none"></div>
        <div style="margin-top:8px;font-size:.8rem;color:#5f6368">Ou acompanhe direto: <a href="https://www2.correios.com.br/sistemas/rastreamento/" target="_blank">site dos Correios</a></div>
      </div>`;
    }else if(!isDF){
      rastreio=`<div class="rastreio-box" style="background:#fef7e0;border-color:#fde293">
        <div style="font-weight:600">Aguardando envio</div>
        <div style="font-size:.9rem;color:#5f6368;margin-top:4px">Seu pagamento foi confirmado. Assim que o admin despachar pelos Correios, o código de rastreio chegará aqui.</div>
      </div>`;
    }
    const whatsappBox = isDF ? `<div style="margin-top:12px;padding:12px;background:#e6f4ea;border:1px solid #c8e6c9;border-radius:10px"><div style="font-weight:600;margin-bottom:6px">${p.entrega_tipo==='Retirada no local' ? 'Retirada na loja' : 'Entrega via Uber'}</div><button class="btn-primary" style="width:100%" onclick="whatsappVendedor('${p.id_pedido}','${p.entrega_tipo}','${p.endereco_entrega.replace(/'/g,"\\'")}')">${p.entrega_tipo.includes('Retirada') ? 'Solicitar endereço da loja' : 'Chamar vendedor no WhatsApp'}</button><small style="color:#666">Informa tipo, endereço, nome e nº do pedido</small></div>` : '';
    return `<div class="compra-card">
      <div class="compra-top">
        <div><div class="pedido-id">Pedido ${p.id_pedido||'#'+p.id}</div><div class="pedido-data">${data} • ${p.entrega_tipo || 'Entrega'}</div></div>
        <div class="badges"><span class="badge ${badgeCls(p.status)}">${badgeIcon(p.status)} ${p.status}</span></div>
      </div>
      <div class="compra-body">
        <div>
          <div style="font-weight:600;margin-bottom:8px">Itens (${itens.length})</div>
          <div class="itens-list">${itensHTML}</div>
          <div class="cta"><a class="btn-ghost" href="/pages/loja.html">Comprar novamente</a><button class="btn-ghost" onclick="navigator.clipboard.writeText('${p.id_pedido||p.id}')">Copiar nº do pedido</button></div>
        </div>
        <div>
          <div class="resumo-box">
            <div class="resumo-linha"><span>Subtotal</span><span>${total}</span></div>
            ${isDF ? '' : `<div class="resumo-linha"><span>Frete</span><span style="color:#137333">Grátis • Brasil todo</span></div>`}
            <div class="resumo-linha resumo-total"><span>Total pago</span><span>${total}</span></div>
            <div class="endereco"><strong>${isDF ? p.entrega_tipo : 'Entrega'}:</strong><br>${p.endereco_entrega}</div>
          </div>
          ${rastreio}${whatsappBox}
        </div>
      </div>
    </div>`;
  }).join('');
}
async function whatsappVendedor(idPedido, tipo, endereco){
  let nome=''; try{ const u=api.getUser(); if(u?.username?.includes('@')){ const c=await api.getClienteByEmail(u.username).catch(()=>null); if(c?.nome) nome=c.nome; } if(!nome){ const raw=sessionStorage.getItem(`cliente_vinculado_${u.username}`)||localStorage.getItem(`cliente_vinculado_${u.username}`); if(raw){ const j=JSON.parse(raw); if(j?.nome) nome=j.nome; } } }catch(_){}
  if(!nome) nome=api.getUser()?.username||'cliente';
  const tel=window.VENDEDOR_WHATSAPP||'5561999999999';
  let msg=tipo.includes('Retirada')?`Olá! Meu pedido ${idPedido} é Retirada na loja. Meu nome é ${nome}. Poderia me enviar o endereço da loja? Pedido: ${idPedido}`:`Olá! Meu pedido ${idPedido} é Entrega via Uber. Meu nome é ${nome}, meu endereço é ${endereco}, tipo: ${tipo}. Pedido: ${idPedido}`;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
}
function copiar(txt){ navigator.clipboard.writeText(txt); Componentes.toast('Código copiado!','success'); }
function fmtData(d){ if(!d) return ''; try{ const dt=new Date(d); return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' '+dt.toLocaleDateString('pt-BR',{weekday:'long'}).slice(0,3); }catch{ return d; } }
async function rastrear(codigo){
  const el=document.getElementById(`rastreio-${codigo}`);
  el.style.display='block'; el.innerHTML='<div style="padding:12px">Consultando Correios...</div>';
  try{
    const res=await api.rastrear(codigo);
    const steps=res.steps||[];
    const eventos=res.eventos||[];
    if(steps.length){
      const pedidoVal = document.querySelector(`[data-pedido-codigo="${codigo}"]`)?.dataset.valor||'';
      const pedidoId = document.querySelector(`[data-pedido-codigo="${codigo}"]`)?.dataset.pedido||'';
      const stepper = `<div class="delivery-card"><div class="delivery-head"><div><h4>Order Delivery Status</h4><small>Acompanhe o status da sua entrega com prazo estimado</small></div><div style="text-align:right"><div style="font-weight:700">Total: ${pedidoVal}</div><small>Order: #${pedidoId}</small></div></div><div class="stepper">${steps.map((s,i)=>`<div class="step ${s.ativo?'ativo':''}"><div class="step-dot"></div><div class="step-line ${s.ativo?'':'dashed'}" style="${s.ativo?'background:#1a9e4a':''}"></div><div class="step-label">${s.label}</div><div class="step-date">${s.data?fmtData(s.data):(s.ativo?'—':'')}</div></div>`).join('')}</div></div>`;
      const timeline = eventos.length? `<div class="timeline" style="margin-top:14px">${eventos.slice(0,5).map((e,i)=>`<div class="tl-item ${i===0?'done':''}"><div class="tl-title">${e.descricao||e.status||JSON.stringify(e)}</div><div class="tl-sub">${e.dtHrCriado||e.data||e.criado_em||''} ${e.unidade?.local||e.local||''}</div><div style="font-size:.85rem">${e.detalhe||e.complemento||''}</div></div>`).join('')}</div>` : '';
      el.innerHTML=stepper+timeline;
    } else {
      let ev = eventos;
      if(!ev.length) el.innerHTML='<div class="tl-item">Nenhum evento encontrado.</div>';
      else el.innerHTML=ev.map((e,i)=>`<div class="tl-item ${i===0?'done':''}"><div class="tl-title">${e.descricao||e.status||JSON.stringify(e)}</div><div class="tl-sub">${e.dtHrCriado||e.data||e.criado_em||''} ${e.unidade?.local||e.local||''}</div><div style="font-size:.85rem">${e.detalhe||e.complemento||''}</div></div>`).join('');
    }
  }catch(e){ el.innerHTML=`<div class="tl-item" style="color:#c5221f">Erro: ${e.message}</div><a href="https://www2.correios.com.br/sistemas/rastreamento/" target="_blank">Abrir no site dos Correios: ${codigo}</a>`; }
}
init();
</script>
</body>
</html>
